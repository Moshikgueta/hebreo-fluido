# Hebreo Fluido - o site em espanhol do Hebraico Fluente (PLANO-ESPANHOL.md).
#
# Este repositório é o do site em espanhol, com BANCO PRÓPRIO (decisão do dono,
# 04/11/2026): as contas e os dados dos alunos de fora não se misturam com os do
# site brasileiro. O código é o mesmo do Moshikgueta/hebraicofluente; o que muda
# é esta configuração (LOCALE = "es", o export app/out-es, o banco, o domínio).
#
# AINDA NÃO SE PUBLICA. Faltam, nesta ordem:
#   1. o domínio em espanhol (decisão do dono): entram as `routes`, o
#      SITE_ORIGIN e o EMAIL_FROM;
#   2. (FEITO em 04/11/2026: o banco hebreo-fluido existe, com o schema, pela
#      Action "Criar o banco"; o id está abaixo);
#   3. a variável de repositório HEBREO_PUBLICAR = true (Settings > Secrets and
#      variables > Actions > Variables): sem ela nenhuma Action deste
#      repositório roda.
#
# Montar à mão, para conferir:
#   cd app && NEXT_PUBLIC_LOCALE=es HF_I18N_ESTRITO=1 npm run build   # gera app/out-es
#   npx wrangler dev --local

name = "hebreo-fluido"
main = "worker/src/worker.js"
compatibility_date = "2026-09-01"

# Sem domínio ainda: só o workers.dev, para conferência. Quando o domínio
# entrar, as `routes` vêm para cá (como no wrangler.toml do site brasileiro) e
# esta linha volta para false.
workers_dev = true

[assets]
directory = "./app/out-es"
binding = "ASSETS"
# A mesma lista do site brasileiro, pelos mesmos motivos (ver lá).
run_worker_first = [
  "/*",
  "!/_next/static/*",
  "!/fonts/*",
  "!/media/*",
  "!/tracado-amostra/*"
]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "hebreo-fluido"
database_id = "ee049821-2fdb-406f-a32e-a459673d6c90"

# Banco próprio, então a varredura (pagamentos, alertas, faxina, lembretes)
# roda aqui, sobre este banco.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# O idioma do site: o Worker escreve e-mails e páginas de erro em espanhol, e
# cobra pelo Paddle (worker/src/lib/idioma.js, api/pay.js).
LOCALE = "es"
# O endereço do site: enquanto não há domínio em espanhol, o workers.dev da
# conta (como o site em inglês faz). Quando o domínio entrar, trocar aqui e
# acrescentar as `routes`. A build em espanhol lê esta linha (app/next.config.ts)
# para o endereço canônico, o sitemap e o cartão do link.
SITE_ORIGIN = "https://hebreo-fluido.moshikg10.workers.dev"
# Enquanto não há domínio em espanhol, o remetente é o endereço do domínio
# brasileiro, já verificado no Resend, com o nome do site em espanhol (como o
# site em inglês faz). Sem ele o Worker não manda e-mail nenhum, e o painel
# de /admin não abre: o código de seis dígitos vai por e-mail. Quando o
# domínio em espanhol entrar e for verificado no Resend, trocar aqui.
EMAIL_FROM = "Hebreo Fluido <contato@hebraicofluente.com.br>"
SUPPORT_EMAIL = "languageswithmoshik@gmail.com"
CONTATO_DESTINO = "languageswithmoshik@gmail.com"
ADMIN_EMAILS = "languageswithmoshik@gmail.com"
