# Hebreo Fluido - o site em espanhol do Hebraico Fluente (PLANO-ESPANHOL.md).
#
# Este repositório é o do site em espanhol, com BANCO PRÓPRIO (decisão do dono,
# 04/11/2026): as contas e os dados dos alunos de fora não se misturam com os do
# site brasileiro. O código é o mesmo do Moshikgueta/hebraicofluente; o que muda
# é esta configuração (LOCALE = "es", o export app/out-es, o banco, o domínio).
#
# AINDA NÃO SE PUBLICA. Faltam, nesta ordem:
#   1. (FEITO em 06/11/2026: o domínio hebreofluido.com, ligado pelo dono na
#      Cloudflare; entraram as `routes` e o SITE_ORIGIN. O EMAIL_FROM ainda
#      sai do domínio brasileiro até o hebreofluido.com ser verificado no
#      Resend);
#   2. (FEITO em 04/11/2026: o banco hebreo-fluido existe, com o schema, pela
#      Action "Criar o banco"; o id está abaixo);
#   3. a variável de repositório HEBREO_PUBLICAR = true (Settings > Secrets and
#      variables > Actions > Variables): sem ela nenhuma Action deste
#      repositório roda.
#
# Montar à mão, para conferir:
#   cd app && NEXT_PUBLIC_LOCALE=es HF_I18N_ESTRITO=1 npm run build   # gera app/out-es
#   npx wrangler dev --local

name = "hebreo-fluido"
main = "worker/src/worker.js"
compatibility_date = "2026-09-01"

# O domínio em espanhol (06/11/2026), como no wrangler.toml do site
# brasileiro: `custom_domain = true` faz o wrangler criar o registro DNS e o
# certificado (a zona está na mesma conta Cloudflare). O www entra para ser
# REDIRECIONADO ao endereço sem www (worker/src/worker.js), não para servir
# o site.
routes = [
  { pattern = "hebreofluido.com", custom_domain = true },
  { pattern = "www.hebreofluido.com", custom_domain = true }
]

# O workers.dev fica ligado por enquanto, como rede de segurança enquanto o
# domínio novo é conferido. Depois de confirmado, volta para false (como no
# site brasileiro): as regras de proteção da Cloudflare só valem no domínio.
workers_dev = true

[assets]
directory = "./app/out-es"
binding = "ASSETS"
# A mesma lista do site brasileiro, pelos mesmos motivos (ver lá).
run_worker_first = [
  "/*",
  "!/_next/static/*",
  "!/fonts/*",
  "!/media/*",
  "!/tracado-amostra/*"
]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "hebreo-fluido"
database_id = "ee049821-2fdb-406f-a32e-a459673d6c90"

# Banco próprio, então a varredura (pagamentos, alertas, faxina, lembretes)
# roda aqui, sobre este banco.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# O idioma do site: o Worker escreve e-mails e páginas de erro em espanhol, e
# cobra pelo Paddle (worker/src/lib/idioma.js, api/pay.js).
LOCALE = "es"
# O endereço do site (06/11/2026). A build em espanhol lê esta linha
# (app/next.config.ts) para o endereço canônico, o sitemap e o cartão do link.
SITE_ORIGIN = "https://hebreofluido.com"
# Até o hebreofluido.com ser verificado no Resend, o remetente é o endereço do
# domínio brasileiro, já verificado lá, com o nome do site em espanhol (como o
# site em inglês faz). Sem ele o Worker não manda e-mail nenhum, e o painel
# de /admin não abre: o código de seis dígitos vai por e-mail. Depois de
# verificar o hebreofluido.com no Resend, trocar aqui.
EMAIL_FROM = "Hebreo Fluido <contato@hebraicofluente.com.br>"
SUPPORT_EMAIL = "languageswithmoshik@gmail.com"
CONTATO_DESTINO = "languageswithmoshik@gmail.com"
ADMIN_EMAILS = "languageswithmoshik@gmail.com"
